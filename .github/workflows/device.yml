name: Device

# Emulator end-to-end suite (app/src/androidTest/java/com/piptechnologies/openchat/e2e) on API 30 and 34, against
# the CI-only stand-in app built from e2e-fixture/ (package com.whatsapp, never published). Device screenshots
# (every language, every flow step, failures), the test reports and logcat are uploaded as artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A running emulator suite is never cancelled (it takes ~20 minutes); newer pushes wait, and GitHub keeps
# only the newest waiting run.
concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  device:
    name: device (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The emulator refuses to start when it cannot create its userdata partition (run 7: "Not enough space to
      # create userdata partition. Available: 5358 MB, need 7372 MB"). Drop toolchains this job never uses.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app, its instrumented tests and the stand-in
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :e2e-fixture:assembleDebug --stacktrace
      - name: Run the end-to-end suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # pixel_6 asks for a 6 GB data partition; the app, its tests and the stand-in need a fraction of that.
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          # Each line runs on its own in sh: keep every line self-contained.
          script: |
            adb install -r -g e2e-fixture/build/outputs/apk/debug/e2e-fixture-debug.apk
            ./gradlew :app:connectedDebugAndroidTest --stacktrace || echo "E2E_FAILED=1" >> "$GITHUB_ENV"
            adb pull /sdcard/Download/openchat-e2e e2e-screens || echo "No device screenshots to pull"
            adb logcat -d > logcat.txt || echo "No logcat"
      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-screens-api${{ matrix.api-level }}
          path: e2e-screens
          if-no-files-found: ignore
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-logcat-api${{ matrix.api-level }}
          path: logcat.txt
          if-no-files-found: ignore
      - name: Fail when the suite failed
        if: env.E2E_FAILED == '1'
        run: |
          echo "The end-to-end suite failed on API ${{ matrix.api-level }}: see the test reports, screenshots and logcat artifacts."
          exit 1
